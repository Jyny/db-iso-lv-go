# Latest stable releases (2026-11): PostgreSQL 18.6, MySQL 9.7 LTS
services:
  postgres:
    image: postgres:18.6
    container_name: lab-postgres
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_prepared_transactions=10
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:9.7.4
    container_name: lab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: lab
      MYSQL_DATABASE: lab
    command:
      - --innodb-print-all-deadlocks=ON
      - --performance-schema=ON
    ports: ["53306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plab"]
      interval: 2s
      retries: 60
